# Generated by Jim Teresco, using Gemini, 8/18/2026

name: Coordinate Consistency Check

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - '**/*.wpt'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to check (leave blank for current branch)'
        required: false
        default: ''
        type: string

jobs:
  check-coordinates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # <-- Required to post comments on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch target branches and setup PR commit
        env:
          PR_NUM: ${{ github.event.inputs.pr_number }}
        run: |
          git fetch origin master:refs/remotes/origin/master || git fetch origin main:refs/remotes/origin/main || true
          if [ -n "$PR_NUM" ]; then
            echo "Fetching and checking out PR #$PR_NUM..."
            git fetch origin pull/$PR_NUM/head:manual-pr-check
            git checkout manual-pr-check
          fi

      - name: Checkout DataProcessing repository
        uses: actions/checkout@v4
        with:
          repository: TravelMapping/DataProcessing
          path: DataProcessing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Coordinate Consistency Check
        continue-on-error: true # Let workflow continue so it can post the comment before failing
        id: ccc_run
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PYTHONUNBUFFERED: "1"
        run: |
          python DataProcessing/CoordConsistencyCheck/ccc.py 2>&1

      - name: Post or Update PR Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ env.GITHUB_STEP_SUMMARY }}
          comment-author: 'github-actions[bot]'
          edit-mode: replace
          comment-type: 'pr'

      - name: Check Execution Status
        if: steps.ccc_run.outcome != 'success'
        run: |
          echo "Coordinate Consistency Check failed."
          exit 1
