# Generated by Jim Teresco, using Gemini, 8/18/2026

name: Coordinate Consistency Check

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - '**/*.wpt'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to check (leave blank for current branch)'
        required: false
        default: ''
        type: string

jobs:
  check-coordinates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch target branches and setup PR commit
        env:
          PR_NUM: ${{ github.event.inputs.pr_number }}
        run: |
          # Make sure target remote ref exists locally
          git fetch origin master:refs/remotes/origin/master || git fetch origin main:refs/remotes/origin/main || true
          
          if [ -n "$PR_NUM" ]; then
            echo "Fetching and checking out PR #$PR_NUM..."
            git fetch origin pull/$PR_NUM/head:manual-pr-check
            git checkout manual-pr-check
          fi

      - name: Checkout DataProcessing repository
        uses: actions/checkout@v4
        with:
          repository: TravelMapping/DataProcessing
          path: DataProcessing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Coordinate Consistency Check
        run: |
          # Determine the base branch (default to master)
          BASE_BRANCH="${{ github.base_ref }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="master"
          fi

          # Find the exact commit where this PR branched off from the base branch
          MERGE_BASE=$(git merge-base "origin/$BASE_BRANCH" HEAD || echo "origin/$BASE_BRANCH")
          echo "Comparing against merge-base: $MERGE_BASE"

          # Pass the specific commit SHA to ccc.py
          export GITHUB_BASE_REF="$MERGE_BASE"
          export PYTHONUNBUFFERED="1"

          python DataProcessing/CoordConsistencyCheck/ccc.py
