name: Highway data check

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datacheck:
    if: github.repository == 'TravelMapping/HighwayData' || github.repository == 'eeffaann/HighwayData'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out highway data
        uses: actions/checkout@v7
        with:
          path: HighwayData
          persist-credentials: false

      - name: Check out DataProcessing
        uses: actions/checkout@v7
        with:
          repository: TravelMapping/DataProcessing
          ref: 92db014f52f9e6021aba5f697cc98d9daa924e0f
          path: DataProcessing
          persist-credentials: false

      - name: Check out UserData
        uses: actions/checkout@v7
        with:
          repository: TravelMapping/UserData
          path: UserData
          persist-credentials: false

      - name: Install C++ build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang make libfmt-dev

      - name: Build C++ site update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p datacheck
          make -C DataProcessing/siteupdate/cplusplus -j 2 siteupdate \
            2>&1 | tee datacheck/build.log

      - name: Run datacheck
        id: datacheck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p datacheck/logs/users datacheck/logs/nmpbyregion datacheck/stats
          {
            for repo in HighwayData DataProcessing UserData; do
              printf '%s @ ' "$repo"
              git -C "$repo" rev-parse HEAD
            done
            DataProcessing/siteupdate/cplusplus/siteupdate \
              -e -k -t 2 \
              -w HighwayData \
              -u UserData/list_files \
              -l datacheck/logs \
              -c datacheck/stats
          } 2>&1 | tee datacheck/console.log
          grep -Fq '!!! DATA CHECK SUCCESSFUL !!!' datacheck/console.log

      - name: Upload datacheck results
        id: reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datacheck-results
          # Keep review diagnostics, not per-user logs, statistics, or rewritten WPTs.
          path: |
            datacheck/build.log
            datacheck/console.log
            datacheck/logs/datacheck.log
            datacheck/logs/nearmisspoints.log
            datacheck/logs/tm-master.nmp
            datacheck/logs/nmpfpsunmatched.log
            datacheck/logs/unmatchedfps.log
            datacheck/logs/nearmatchfps.log
            datacheck/logs/unprocessedwpts.log
          retention-days: 7
          if-no-files-found: error

      - name: Summarize datacheck
        if: always()
        shell: bash
        env:
          CHECK_OUTCOME: ${{ steps.datacheck.outcome }}
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          {
            printf '## Highway data check\n\n'
            printf 'Checker step outcome: **%s**.\n\n' "$CHECK_OUTCOME"
            printf 'Green means processing completed without fatal errors and emitted the success marker; it does not mean there are no data findings.\n\n'
            printf 'Ordinary datacheck and near-miss findings still need human review. This pilot adds no required-check or merge-policy settings and does not compare findings with a baseline.\n\n'
            printf 'Download **datacheck-results** from this run (retained for 7 days). It contains `build.log`, `console.log` with all three checked-out SHAs, and available diagnostic reports under `logs/`, including `datacheck.log`, `nearmisspoints.log`, and `tm-master.nmp`. Per-user logs, statistics, and rewritten WPTs are excluded.\n\n'
            if [ -n "$ARTIFACT_URL" ]; then
              printf '[Download diagnostic artifact](%s)\n' "$ARTIFACT_URL"
            else
              printf 'No artifact was uploaded; inspect the failed steps and job log for details.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
